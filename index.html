<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Rock, Paper, Scissors</h1>
        </div>
        <div class="scores">
            <div class="score-box">
                <span class="box"><h1 id="player-score" class="score">0</h1></span>
                <h3>Player Score</h3>
            </div>
            <div class="msg-box">
                <h4 id="msg-play">this is a test</h4>
            </div>
            <div class="score-box">
                <span class="box"><h1 id="computer-score" class="score">0</h1></span>
                <h3>Computer Score</h3>
            </div>
        </div>
        <div class="player-options">
            <h1>CHOOSE YOUR WEAPON</h1>
            <div class="img-container">
                <img src="IMAGES/Fist icon.png">
                <img src="IMAGES/Hand icon.png">
                <img src="IMAGES/Scissors icon.png">
            </div>
            
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
